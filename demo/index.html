<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f4a">
  <meta name="description" content="Interactive U-Mail demo for UTICA Jendouba, using sample messages only.">
  <title>U-Mail Demo | UTICA Jendouba</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#192d3f;background:#f4f6f8;font-synthesis:none;text-rendering:optimizeLegibility;--navy:#102f4a;--navy2:#173e5f;--orange:#d88b26;--muted:#74808a;--line:#e5e9ec;--paper:#fff;--green:#278364}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}
    .shell{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}
    aside{background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:22px 16px;min-height:100vh}
    .brand{display:flex;align-items:center;gap:11px;padding:0 8px 21px;border-bottom:1px solid #ffffff20}.brand img{width:44px;height:44px;object-fit:contain;background:white;padding:3px}.brand b{display:block;font-size:16px;letter-spacing:.08em}.brand small{display:block;color:#bac8d1;font-size:10px;margin-top:4px;letter-spacing:.12em;text-transform:uppercase}
    .demo-tag{margin:16px 8px 20px;color:#f2c27d;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .nav{display:grid;gap:4px}.nav button,.assist{border:0;background:transparent;color:#d2dbe1;text-align:left;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:5px;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff15;color:#fff}.nav .ico{width:18px;text-align:center;color:#e5a645;font-size:16px}.compose{background:#fff!important;color:var(--navy)!important;font-weight:700;margin:0 0 8px}.compose .ico{font-size:19px}.assist{margin-top:16px;border:1px solid #ffffff28;color:#f3d3a3}.aside-foot{margin-top:auto;padding:16px 8px 2px;color:#a9bac6;font-size:11px;line-height:1.55;border-top:1px solid #ffffff20}
    main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 clamp(18px,4vw,54px)}.search{max-width:650px;flex:1;position:relative}.search span{position:absolute;left:14px;top:10px;color:var(--orange)}.search input{width:100%;border:1px solid transparent;border-radius:4px;background:#f4f6f7;padding:11px 14px 11px 40px;outline:none}.search input:focus{border-color:#d5a965;background:white}.top-right{margin-left:auto;text-align:right;font-size:10px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.top-right b{display:block;color:var(--navy);font-size:11px;margin-bottom:4px}.content{padding:clamp(22px,4vw,48px);max-width:1380px;margin:auto}.eyebrow{color:#a36a1c;font-size:10px;letter-spacing:.2em;font-weight:700;text-transform:uppercase}.title-row{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:0 0 26px}.title-row h1{font-size:34px;line-height:1;margin:10px 0 0;color:var(--navy);font-weight:600;letter-spacing:.01em}.count{text-align:right;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.count strong{display:block;font-size:25px;color:var(--orange);font-weight:600;letter-spacing:0}
    .assistbar{border:1px solid var(--line);background:#fff;border-radius:5px;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}.assistbar strong{font-size:10px;letter-spacing:.1em;color:#a36a1c;margin-right:4px}.assistbar button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 11px;color:#53616d;font-size:10px;font-weight:700;text-transform:uppercase}.assistbar button:hover{border-color:#d4a962;color:#8b5a17}.labels{width:100%;border:1px solid var(--line);border-radius:4px;background:#fff;text-align:left;padding:13px 16px;color:#56636e;margin-bottom:4px}.rows{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden}.row{display:grid;grid-template-columns:32px minmax(110px,190px) minmax(0,1fr) 60px 28px;gap:12px;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line);min-height:65px}.row:last-child{border-bottom:0}.row:hover{background:#fbfaf7}.star{border:0;background:transparent;color:#a4adb3;font-size:17px;padding:4px}.star.on{color:var(--orange)}.sender{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:650}.preview{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:#475865}.preview b{color:#23394a}.time{text-align:right;color:#64727c;font-size:11px}.more{border:0;background:transparent;color:#78838b;font-size:18px}.empty{padding:44px;text-align:center;color:var(--muted)}
    .note{margin-top:22px;color:#66727b;font-size:11px;line-height:1.6}.note strong{color:#344b5d}
    .overlay{position:fixed;inset:0;background:#102f4a80;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.overlay.open{display:flex}.dialog{background:#fff;width:min(100%,680px);max-height:min(88vh,760px);overflow:auto;border-radius:6px;box-shadow:0 24px 80px #102f4a40}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:16px;margin:0;color:var(--navy)}.icon-button{width:34px;height:34px;border:1px solid var(--line);border-radius:4px;background:#fff;color:#576570}.dialog-body{padding:22px}.dialog-body label{display:block;font-size:11px;color:#687680;margin:0 0 14px}.dialog-body input,.dialog-body textarea{display:block;width:100%;padding:10px;margin-top:5px;border:1px solid var(--line);border-radius:4px;outline:none}.dialog-body textarea{min-height:140px;resize:vertical}.primary{border:0;border-radius:4px;background:var(--navy);color:#fff;padding:10px 18px;font-weight:650}.primary:hover{background:var(--navy2)}.message-meta{font-size:12px;color:var(--muted);line-height:1.7;border-bottom:1px solid var(--line);padding-bottom:15px}.message-copy{white-space:pre-line;line-height:1.75;color:#354b5b;padding:20px 0}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding:14px 22px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#173e5f;color:#fff;padding:11px 16px;border-radius:4px;font-size:12px;z-index:9;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.shell{grid-template-columns:64px minmax(0,1fr)}aside{padding:16px 8px}.brand{justify-content:center;padding:0 0 16px}.brand img{width:38px;height:38px}.brand-copy,.demo-tag,.nav-label,.nav button span:not(.ico),.assist span,.aside-foot{display:none}.nav button,.assist{justify-content:center;padding:12px 4px}.content{padding:22px 14px}.top{padding:0 14px}.top-right{display:none}.row{grid-template-columns:25px minmax(80px,110px) minmax(0,1fr);gap:8px;padding:12px 9px}.time,.more{display:none}.title-row h1{font-size:28px}.count{font-size:9px}.count strong{font-size:20px}}
    @media(max-width:420px){.shell{grid-template-columns:54px minmax(0,1fr)}.row{grid-template-columns:22px minmax(0,1fr);gap:6px}.sender{grid-column:2}.preview{grid-column:2;margin-top:-8px;font-size:12px}.brand img{width:34px;height:34px}.title-row{align-items:start}.title-row h1{font-size:25px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><img src="./utica-jendouba-logo.png" alt="UTICA Jendouba"><span class="brand-copy"><b>U-MAIL</b><small>Jendouba workspace</small></span></div>
      <div class="demo-tag">Interactive sample</div>
      <nav class="nav" aria-label="Mailbox folders">
        <button class="compose" id="compose"><span class="ico">＋</span><span>Compose</span></button>
        <button class="active" data-folder="Inbox"><span class="ico">▣</span><span>Inbox</span></button>
        <button data-folder="Starred"><span class="ico">☆</span><span>Starred</span></button>
        <button data-folder="Sent"><span class="ico">➤</span><span>Sent</span></button>
        <button data-folder="Drafts"><span class="ico">▤</span><span>Drafts</span></button>
        <button data-folder="Scheduled"><span class="ico">◷</span><span>Scheduled</span></button>
        <button data-folder="Archive"><span class="ico">▱</span><span>Archive</span></button>
        <button data-folder="Trash"><span class="ico">♲</span><span>Trash</span></button>
        <button data-folder="Calendar"><span class="ico">▦</span><span>Calendar</span></button>
      </nav>
      <button class="assist" id="assist"><span class="ico">✧</span><span>U-Assist</span></button>
      <div class="aside-foot">Demo workspace<br>Sample data only · No sign-in</div>
    </aside>
    <main>
      <header class="top"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search sample messages" aria-label="Search sample messages"></label><div class="top-right"><b>UTICA Jendouba</b>Sample mailbox</div></header>
      <section class="content">
        <div class="title-row"><div><div class="eyebrow">UTICA Jendouba mailbox</div><h1 id="folder-title">Inbox</h1></div><div class="count"><strong id="message-count">3</strong>sample messages</div></div>
        <div class="assistbar"><strong>✧ U-ASSIST</strong><button data-assist="Summarize unread">Summarize unread</button><button data-assist="Needs reply">Needs reply</button><button data-assist="Urgent only">Urgent only</button></div>
        <button class="labels" id="labels">◇ &nbsp; Labels</button>
        <div class="rows" id="rows" aria-live="polite"></div>
        <p class="note"><strong>Public demo.</strong> Names, messages, and actions are fictional. Nothing is sent or saved.</p>
      </section>
    </main>
  </div>
  <div class="overlay" id="compose-dialog" role="dialog" aria-modal="true" aria-labelledby="compose-title"><section class="dialog"><header class="dialog-head"><h2 id="compose-title">New message</h2><button class="icon-button" data-close="compose-dialog" aria-label="Close">×</button></header><form id="compose-form"><div class="dialog-body"><label>To<input type="email" placeholder="colleague@example.test" required></label><label>Subject<input placeholder="Message subject" required></label><label>Message<textarea placeholder="Write a sample message…" required></textarea></label></div><footer class="dialog-actions"><button type="button" class="icon-button" data-close="compose-dialog">Cancel</button><button class="primary" type="submit">Preview send</button></footer></form></section></div>
  <div class="overlay" id="message-dialog" role="dialog" aria-modal="true" aria-labelledby="message-title"><section class="dialog"><header class="dialog-head"><h2 id="message-title"></h2><button class="icon-button" data-close="message-dialog" aria-label="Close">×</button></header><div class="dialog-body"><div class="message-meta" id="message-meta"></div><div class="message-copy" id="message-copy"></div></div><footer class="dialog-actions"><button class="icon-button" data-close="message-dialog">Close</button><button class="primary" id="reply">Reply</button></footer></section></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const samples=[
      {from:'Leila Mansour',subject:'Regional planning session',preview:'The planning notes are ready for the Thursday review.',time:'09:42',folder:'Inbox',star:false,body:'Hello team,\n\nThe planning notes are ready for our Thursday review. Please add any final comments to the shared agenda before the meeting.\n\nRegards,\nLeila'},
      {from:'Sami Gharbi',subject:'June activity summary',preview:'A short summary of this month’s member activities.',time:'Yesterday',folder:'Inbox',star:true,body:'Hello,\n\nHere is the June activity summary for the communications group. The report includes event attendance and the next set of outreach dates.\n\nBest,\nSami'},
      {from:'Nour Ben Salem',subject:'Partnership meeting',preview:'Could you confirm which time works for the team?',time:'Mon',folder:'Inbox',star:false,body:'Good morning,\n\nCould you confirm whether Thursday at 10:00 or 14:00 works for the team? I will send the calendar invitation once we settle on a time.\n\nThank you,\nNour'},
      {from:'You',subject:'Welcome to the U-Mail demo',preview:'This is a fictional message in a safe public preview.',time:'Mon',folder:'Sent',star:false,body:'This interactive preview uses fictional content only. Compose, folders, search, and message previews are available to explore.'},
      {from:'Demo Workspace',subject:'Draft: upcoming announcement',preview:'A sample draft stored only in this browser session.',time:'Fri',folder:'Drafts',star:true,body:'Draft content is not sent or saved. This preview demonstrates the mailbox layout and interactions.'}
    ];
    const rows=document.getElementById('rows'), search=document.getElementById('search'), title=document.getElementById('folder-title');let folder='Inbox';
    function render(){const q=search.value.trim().toLowerCase();const items=samples.filter(m=>(folder==='Starred'?m.star:m.folder===folder)&&(!q||`${m.from} ${m.subject} ${m.preview}`.toLowerCase().includes(q)));document.getElementById('message-count').textContent=items.length;rows.innerHTML=items.length?items.map((m,i)=>`<article class="row"><button class="star ${m.star?'on':''}" data-star="${samples.indexOf(m)}" aria-label="${m.star?'Unstar':'Star'} message">${m.star?'★':'☆'}</button><div class="sender">${escapeText(m.from)}</div><button class="preview" data-message="${samples.indexOf(m)}"><b>${escapeText(m.subject)}</b> &nbsp;·&nbsp; ${escapeText(m.preview)}</button><time class="time">${escapeText(m.time)}</time><button class="more" data-message="${samples.indexOf(m)}" aria-label="Open message">⋮</button></article>`).join(''):`<div class="empty">No sample messages here.</div>`;}
    function escapeText(value){return value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function toast(message){const node=document.getElementById('toast');node.textContent=message;node.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.remove('show'),2300)}
    function open(id){document.getElementById(id).classList.add('open')}
    function close(id){document.getElementById(id).classList.remove('open')}
    document.querySelectorAll('[data-folder]').forEach(button=>button.addEventListener('click',()=>{folder=button.dataset.folder;title.textContent=folder;document.querySelectorAll('[data-folder]').forEach(item=>item.classList.toggle('active',item===button));render()}));
    rows.addEventListener('click',event=>{const star=event.target.closest('[data-star]');if(star){samples[Number(star.dataset.star)].star=!samples[Number(star.dataset.star)].star;render();return}const message=event.target.closest('[data-message]');if(message){const item=samples[Number(message.dataset.message)];document.getElementById('message-title').textContent=item.subject;document.getElementById('message-meta').textContent=`From ${item.from} · ${item.time} · demo@example.test`;document.getElementById('message-copy').textContent=item.body;open('message-dialog')}});
    search.addEventListener('input',render);document.getElementById('compose').addEventListener('click',()=>open('compose-dialog'));document.getElementById('assist').addEventListener('click',()=>toast('U-Assist is disabled in this sample demo.'));document.getElementById('labels').addEventListener('click',()=>toast('Labels are not configured in this sample demo.'));
    document.querySelectorAll('[data-assist]').forEach(button=>button.addEventListener('click',()=>toast(`${button.dataset.assist}: sample preview only.`)));document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>close(button.dataset.close)));
    document.querySelectorAll('.overlay').forEach(overlay=>overlay.addEventListener('click',event=>{if(event.target===overlay)close(overlay.id)}));document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelectorAll('.overlay.open').forEach(item=>close(item.id))});
    document.getElementById('compose-form').addEventListener('submit',event=>{event.preventDefault();close('compose-dialog');event.target.reset();toast('Demo only: no message was sent or stored.')});document.getElementById('reply').addEventListener('click',()=>{close('message-dialog');open('compose-dialog');toast('Reply preview: no message will be sent.')});render();
  </script>
</body>
</html>
